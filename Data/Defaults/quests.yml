  - { title: "Bring me a troll's head", trophy: TrophyFrostTroll, count: 1, biome: BlackForest }
  - { title: "Bring me a draugr's head", trophy: TrophyDraugr, count: 1, biome: Swamp }
  - { title: "Bring me a leech", trophy: TrophyLeech, count: 1, biome: Swamp }
  - { title: "Bring me a wraith's head", trophy: TrophyWraith, count: 1, biome: Swamp }
  - { title: "Bring me wolf heads", trophy: TrophyWolf, count: 2, biome: Mountain }
  - { title: "Bring me a fenring's head", trophy: TrophyFenring, count: 1, biome: Mountain }
  - { title: "Bring me a fuling's head", trophy: TrophyGoblin, count: 1, biome: Plains }
  - { title: "Bring me a deathsquito", trophy: TrophyDeathsquito, count: 1, biome: Plains }
