# Which biome a crafting material belongs to (prefab name). An item's biome is the highest biome among
# its recipe materials. Materials not listed here are followed through their own recipe if they have one.
# Deep North materials: add their prefab names here with DeepNorth.
# An item is never below its crafting station's biome, whatever it's made of (the Arbalest is made of early
# materials, but at the Black Forge, so it's a Mistlands item).
