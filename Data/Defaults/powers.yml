# Legendary Loot and ARPG - what affixes and Uniques actually do.
#
# Each entry is a list of powers. A power has:
#   trigger:     passive, onHit, onKill, onShoot, onAttack, whenHit, onBlock, onParry, onLethal, onDodge, every
#                (onAttack = a swing, cast or shot starts)
#                (onDodge = an attack would have hit you, but you dodged through it)
#                (onShoot = a bow, crossbow, staff or throw launches its projectiles)
#   every:       seconds between firings (only for trigger: every)
#   chance:      percent chance each time the trigger happens (leave out = always)
#   cooldown:    seconds before it can fire again
#   charges:     times it can fire before the cooldown starts (e.g. charges: 2 with cooldown: 180)
#   conditions:  extra checks, all must be true (see the list below)
#   effects:     what happens
#
# Numbers can be plain (25), the affix's rolled value (X), or simple math on it (X*2, X/2, X+5, X-1).
# An affix or Unique only drops once it has an entry here (or is coded directly in the mod).
# New powers from mod updates are added automatically, even if this file is older. To switch one off, keep its
# name with an empty list, e.g.  echo: []
#
# Conditions: notBoss, targetBoss, targetMinStars: N, targetBelowHealth: %, targetFullHealth, targetStaggered,
#   targetSlowed (slowed, rooted or staggered), firstHitBelowHealth: %, selfBelowHealth: %, selfStaminaAbove: %,
#   selfMoving, selfStillFor: seconds, fromBehind, secondaryAttack, weaponDamage: fire|frost|lightning|poison|spirit
#
# Effects:
#   stat                 { stat: <affix ID or HealthPercent/StaminaPercent>, value }   (passive)
#   immunity             { to: Burning|Freezing|Frost|Cold|Wet|Poison|Tared }          (passive)
#   heal                 { amount, percentOfDamage, percentOfMaxHealth }
#   stamina              { amount }
#   addDamage            { percent }                 more damage on this hit
#   sneakDamage          { }                         this hit counts as a sneak attack
#   backstabBonus        { percent }                 bigger sneak attack multiplier
#   forceCrit            { }                         this hit is a critical strike
#   currentHealthDamage  { percent, bossPercent }    extra damage = % of the target's current health
#   slow                 { percent, duration, bosses: true }   (bosses are immune unless bosses: true)
#   paralyze             { duration }                staggered, then rooted (bosses immune)
#   bleed                { percentOfDamage, duration, maxStacks }  damage over time, ignores armor
#   vulnerable           { percent, duration }       target takes more damage
#   reflect              { percentOfDamage }         (whenHit) damage back at the attacker
#   reduceDamage         { percent }                 (whenHit) take less damage from this hit
#   buff                 { stat: damage|moveSpeed|attackSpeed|damageTaken|critChance|critDamage|immune|berserk, value, duration, maxStacks }
#   preventDeath         { }                         (onLethal) survive at full health
#   extraProjectiles     { count, spread, pierce: true, percent }   (onShoot) more projectiles in the volley,
#                                                    fanned over 'spread' degrees; pierce = fly through creatures;
#                                                    percent = damage of the extra ones (the middle one keeps 100%)
#   pierce               { max, falloff, staminaPerHit }   (onShoot) projectiles fly through creatures, as if
#                                                    nothing were there; max = how many it passes through
#                                                    (0 = all; max 2 = 3 hits in all), falloff = % less damage after each,
#                                                    staminaPerHit = stamina back for each creature hit
#   explosive            { percent, radius }         (onShoot) arrows burst on impact for % of their damage
#   meteor               { percentOfDamage }         (onHit) a fireball falls on the target
#   nova                 { radius, percentOfDamage, amount, damageType, stagger, at: self|target|kill, fx, sound }
#                                                    damage (and/or stagger) every enemy around you, the target,
#                                                    or where a creature died
#   strike               { percentOfDamage, percentOfBlockPower, amount, damageType, stagger, fx }
#                                                    one extra hit on the target (e.g. lightning on block)
#   chainLightning       { percentOfDamage, jumps, range, thrownCasts }   arcs from the target to nearby enemies;
#                                                    thrownCasts = how many chains a thrown weapon casts
#   lob                  { item, summon, duration, max }   throw a bomb item at the target ("A|B" = first found);
#                                                    with summon, a friendly creature appears where it lands
#   slowNearby           { radius, percent, duration, bosses: true }   slow enemies around you (use with every)
#   slowAura             { radius, percent }         (passive) enemies around you are slowed and move in slow
#                                                    motion; a faint ring shows the edge. Bosses are immune.
#   zone                 { radius, duration, stat, value }   a circle on the ground; standing in it gives the bonus
#   seasons              { percent, period }         the element of the moment (fire, frost, lightning, poison,
#                                                    changing every 'period' seconds) deals +percent
#   elementalDamage      { damageType, percent }     add % of the hit as fire/frost/lightning/poison/spirit
#   recall               { }                         (onShoot) a thrown weapon comes back to your hand
#   extraAttack          { count, fx: thrasher|windfury }   (onHit) the hit lands again, count more times,
#                                                    a moment apart (each a full hit that can crit), with a slash
#                                                    or whirlwind and a sound; extra hits never start more
#   summon               { creature, count, duration, max, at: self|target|kill, weaponDamagePercent,
#                          damageMult, healthMult, scale, invulnerable: true, look, group }
#                                                    friendly creatures that follow and fight for you, then vanish.
#                                                    creature "A|B" = the first that exists (e.g. another mod's
#                                                    creature, else a vanilla one). max = how many can be out at once.
#                                                    weaponDamagePercent = each of its hits deals that % of your weapon.
#                                                    look: raven = a black seagull body (on a Bat)
#
#   adrenaline           { amount }                  gain adrenaline
#   storeBurst           { percent, delay, radius, fx, fxScale, sound }   store % of the hit on the target;
#                                                    after 'delay' it bursts out on everything around it
#   drain                { duration, heal }          the target can't heal, and hits on it heal the hitter by heal%
#   blink                { distance }                teleport away from the attacker (stops short of walls)
#   refundCost           { resource: eitr|stamina }  (onAttack or onShoot) the attack or cast costs nothing
#   split                { count, percent }          (onShoot) projectiles burst into smaller copies where they hit
#   vanish               { duration, radius, fx, sound }   enemies lose sight of you
#   feathers             { charges, regrow, fx, sound }   (passive) each feather stops one projectile; one regrows
#                                                    every 'regrow' seconds
#   shield               { percentMaxHealth, duration }   a bubble that absorbs damage (the Staff of Protection's)
#   root                 { radius, duration, fx, sound }   enemies around you are rooted in place (not bosses)
#   coinDamage           { max, scale }              more damage the more coins you carry, levelling off at max%
#   nova also takes at: ahead (a blast in front of you) and percentOfBlockPower
#
#   damageType: fire, frost, lightning, poison, spirit, blunt, slash, pierce (blank = untyped)
#   fx: fire, lightning, frost, poison, stomp, none, or any of the game's effect prefabs by name (vfx_..., fx_...)
#   sound: a .ogg from the mod's audio folder (it has to be listed in the mod's code to be loaded), or one of the
#          game's own sound prefabs by name (sfx_...)
#
# More conditions: comboHit: N (the Nth swing of a combo), thrown (the hit came from a thrown weapon),
#   everyN: N (only every Nth time the trigger happens, e.g. every 5th block), targetRooted,
#   inCombat: metres (an alerted enemy is that close; default 25)
# "every" can be a range, e.g. every: 180-210 (a new random wait each time). When it comes due, it waits for its
# conditions (e.g. inCombat) and fires as soon as they're met.
#
# Speed stats (use with type: stat, or the buff stats attackSpeed / moveSpeed):
#   ModifyAttackSpeed    attack X% faster (on bows it also speeds up the draw, on crossbows the reload)
#   QuickDraw            draw bows and reload crossbows X% faster

affixes:
  LifeSteal:
    - trigger: onHit
      effects:
        - { type: heal, percentOfDamage: X }

  LifeAfterKill:
    - trigger: onKill
      effects:
        - { type: heal, amount: X }

  Slow:
    - trigger: onHit
      effects:
        - { type: slow, percent: X, duration: 2 }

  Paralyze:
    - trigger: onHit
      cooldown: 5   # so a fast weapon can't keep a creature locked down forever
      effects:
        - { type: paralyze, duration: X }

  ReflectDamage:
    - trigger: whenHit
      effects:
        - { type: reflect, percentOfDamage: X }

  momentum:
    - trigger: onHit
      effects:
        - { type: stamina, amount: X }

  vampiric parry:
    - trigger: onParry
      effects:
        - { type: heal, percentOfMaxHealth: X }

  Executioner:
    - trigger: onHit
      conditions: { firstHitBelowHealth: 20 }
      effects:
        - { type: addDamage, percent: X }

  ModifyStaggerDamage:
    - trigger: onHit
      conditions: { targetStaggered: true }
      effects:
        - { type: addDamage, percent: X }

  ModifyBackstab:
    - trigger: onHit
      effects:
        - { type: backstabBonus, percent: X }

  Opportunist:
    - trigger: onHit
      chance: X
      conditions: { targetStaggered: true }
      effects:
        - { type: sneakDamage }

  perforation:
    - trigger: onHit
      effects:
        - { type: bleed, percentOfDamage: 15, duration: 2 }

  pain tolerance:
    - trigger: whenHit
      effects:
        - { type: reduceDamage, percent: X }

  turtle shell:
    - trigger: whenHit
      conditions: { fromBehind: true }
      effects:
        - { type: reduceDamage, percent: X }

  Warmth:
    - trigger: passive
      effects:
        - { type: immunity, to: Cold }

  ExplosiveArrows:
    - trigger: onShoot
      effects:
        - { type: explosive, percent: X, radius: 3 }

  echo:
    - trigger: onShoot
      chance: X
      effects:
        - { type: extraProjectiles, count: 2, spread: 8 }

  DodgeBuff:
    - trigger: onDodge
      effects:
        - { type: buff, stat: damage, value: X, duration: 10 }

uniques:
  # --- Stat Uniques ---------------------------------------------------------------------------
  AllfathersHood:
    - trigger: passive
      effects:
        - { type: stat, stat: HealthPercent, value: 10 }
        - { type: stat, stat: StaminaPercent, value: 10 }
        - { type: stat, stat: IncreaseEitr, value: 10 }
        - { type: stat, stat: AddAllSkills, value: 3 }

  SurtlingMantle:
    - trigger: passive
      effects:
        - { type: immunity, to: Burning }
        - { type: stat, stat: AddFireResistancePercentage, value: 25 }

  YmirsHide:
    - trigger: passive
      effects:
        - { type: immunity, to: Freezing }
        - { type: immunity, to: Frost }
        - { type: stat, stat: AddFrostResistancePercentage, value: 20 }

  TrollsStrength:
    - trigger: passive
      effects:
        - { type: stat, stat: hercules, value: 20 }

  PrismaticDefender:
    - trigger: passive
      effects:
        - { type: stat, stat: AddElementalResistancePercentage, value: 10 }

  SteadfastCuirass:
    - trigger: whenHit
      conditions: { selfStaminaAbove: 90 }
      effects:
        - { type: reduceDamage, percent: 20 }

  WanderersLeggings:
    - trigger: onHit
      conditions: { selfMoving: true }
      effects:
        - { type: addDamage, percent: 12 }
    - trigger: whenHit
      conditions: { selfStillFor: 1.5 }
      effects:
        - { type: reduceDamage, percent: 15 }

  # --- Proc Uniques ---------------------------------------------------------------------------
  Berserker:
    - trigger: onHit
      chance: 10
      effects:
        - { type: buff, stat: berserk, value: 1, duration: 10 }

  Impenetrable:
    - trigger: whenHit
      chance: 20
      cooldown: 100
      effects:
        - { type: buff, stat: immune, value: 1, duration: 6 }

  Undying:
    - trigger: onLethal
      cooldown: 1200
      effects:
        - { type: preventDeath }

  JarlSlayer:
    - trigger: onHit
      conditions: { targetMinStars: 1, notBoss: true }
      effects:
        - { type: addDamage, percent: 25 }
    - trigger: onHit
      conditions: { targetBoss: true }
      effects:
        - { type: addDamage, percent: 15 }

  Bloodaxe:
    - trigger: onHit
      effects:
        - { type: bleed, percentOfDamage: 15, duration: 3, maxStacks: 3 }

  Logbreaker:
    - trigger: onHit
      chance: 8
      cooldown: 2
      effects:
        - { type: currentHealthDamage, percent: 15, bossPercent: 3 }

  FirstCut:
    - trigger: onHit
      conditions: { targetFullHealth: true }
      effects:
        - { type: forceCrit }

  ReapersArc:
    - trigger: onHit
      conditions: { secondaryAttack: true }
      effects:
        - { type: vulnerable, percent: 15, duration: 6 }

  FenrirsHunger:
    - trigger: onHit
      effects:
        - { type: heal, percentOfDamage: 2 }
    - trigger: onHit
      conditions: { selfBelowHealth: 30 }
      effects:
        - { type: heal, percentOfDamage: 4 }   # 6% in total while below 30% health

  HuntsmansSnare:
    - trigger: onHit
      conditions: { targetSlowed: true }
      effects:
        - { type: addDamage, percent: 25 }

  IronMoor:
    - trigger: onHit
      chance: 15
      cooldown: 4
      effects:
        - { type: paralyze, duration: 2 }

  Eaglehorn:
    - trigger: passive
      effects:
        - { type: stat, stat: ModifyAttackSpeed, value: 20 }
    - trigger: onShoot
      chance: 20
      effects:
        - { type: extraProjectiles, count: 4, spread: 16 }

  Windforce:
    - trigger: passive
      effects:
        - { type: stat, stat: QuickDraw, value: 20 }
    - trigger: onShoot
      effects:
        - { type: pierce }
    - trigger: onShoot
      chance: 20
      effects:
        - { type: extraProjectiles, count: 5, spread: 20, pierce: true }

  Skystrike:
    - trigger: passive
      effects:
        - { type: stat, stat: ModifyAttackSpeed, value: 20 }
    - trigger: onHit
      effects:
        - { type: addDamage, percent: 10 }
    - trigger: onHit
      chance: 20
      cooldown: 5
      effects:
        - { type: meteor, percentOfDamage: 150 }

  BearsRage:
    - trigger: onHit
      effects:
        - { type: buff, stat: attackSpeed, value: 4, duration: 5, maxStacks: 5 }
        - { type: buff, stat: moveSpeed, value: 4, duration: 5, maxStacks: 5 }

  ChainLightning:
    - trigger: onHit
      effects:
        - { type: chainLightning, percentOfDamage: 65, jumps: 3, range: 8 }

  Thunderstroke:
    - trigger: passive
      effects:
        - { type: stat, stat: ModifyAttackSpeed, value: 20 }
    - trigger: onHit
      effects:
        - { type: chainLightning, percentOfDamage: 65, jumps: 3, range: 8, thrownCasts: 2 }
    - trigger: onShoot
      effects:
        - { type: recall }

  Stormstomp:
    - trigger: onHit
      chance: 10
      cooldown: 6
      effects:
        - { type: nova, radius: 5, percentOfDamage: 50, damageType: lightning, stagger: 1, fx: stomp }

  Groundbreaker:
    - trigger: onHit
      conditions: { comboHit: 3 }
      cooldown: 15
      effects:
        - { type: nova, radius: 4, stagger: 1, fx: stomp }

  StormWall:
    - trigger: onBlock
      chance: 20
      effects:
        - { type: strike, percentOfBlockPower: 40, damageType: lightning, fx: lightning }

  BlobberLobber:
    - trigger: onHit
      chance: 20
      effects:
        - { type: lob, item: "BombBlob_Poison|BombBlob_PoisonElite|BombOoze", summon: Blob, duration: 20, max: 2 }

  Frostgrip:
    - trigger: passive
      effects:
        - { type: slowAura, radius: 5, percent: 20 }
    - trigger: onHit
      effects:
        - { type: elementalDamage, damageType: frost, percent: 10 }

  Rotcrown:
    - trigger: whenHit
      chance: 15
      cooldown: 10
      effects:
        - { type: nova, radius: 5, amount: 40, damageType: poison, fx: poison }

  SeidrRing:
    - trigger: onKill
      cooldown: 10
      effects:
        - { type: zone, radius: 5, duration: 6, stat: damage, value: 20 }

  RuneofSeasons:
    - trigger: onHit
      effects:
        - { type: seasons, percent: 25, period: 5 }

  RavensWing:
    - trigger: onHit
      chance: 25
      cooldown: 60
      effects:
        # A bat (it flies and attacks) wearing a black seagull's body.
        - { type: summon, creature: Bat, look: raven, count: 3, duration: 30, max: 3, weaponDamagePercent: 12, invulnerable: true }

  DraugrOath:
    - trigger: onHit
      chance: 10
      cooldown: 60
      effects:
        - { type: summon, creature: Draugr, at: target, duration: 30, max: 1 }

  PackGuardian:
    - trigger: onBlock
      conditions: { everyN: 5 }
      cooldown: 60
      effects:
        - { type: summon, creature: Wolf, count: 2, duration: 15, max: 2 }

  IcyProtection:
    - trigger: every
      every: 60-120
      conditions: { inCombat: 25 }
      effects:
        - { type: buff, stat: damageTaken, value: -50, duration: 8 }
        - { type: summon, creature: Hatchling, count: 3, duration: 30, max: 3 }

  Thrasher:
    - trigger: onHit
      chance: 20
      cooldown: 1
      effects:
        - { type: extraAttack, count: 1, fx: thrasher }

  Windfury:
    - trigger: onHit
      chance: 20
      cooldown: 1
      effects:
        - { type: extraAttack, count: 2, fx: windfury }

  AdrenalCatalyst:
    - trigger: onHit
      chance: 10
      effects:
        - { type: adrenaline, amount: 10 }

  ThroatCutter:
    - trigger: onHit
      effects:
        - { type: storeBurst, percent: 30, delay: 3, radius: 3, fx: vfx_BloodDeath, fxScale: 1.3, sound: throatcuttersound.ogg }

  LifeSiphon:
    - trigger: onHit
      effects:
        - { type: drain, duration: 3, heal: 5 }

  WolfsFang:
    - trigger: onShoot
      effects:
        - { type: pierce, max: 3, falloff: 20, staminaPerHit: 15 }

  FrozenFjord:
    - trigger: onShoot
      effects:
        - { type: pierce, max: 2 }
    - trigger: onHit
      effects:
        - { type: slow, percent: 40, duration: 3 }

  BifrostEye:
    - trigger: whenHit
      chance: 50
      cooldown: 30
      effects:
        - { type: blink, distance: 8 }

  TwinEmbers:
    # Two extra embers fan out alongside each cast; the middle one is the original.
    - trigger: onShoot
      effects:
        - { type: extraProjectiles, count: 2, spread: 14, percent: 30 }

  GaldrFocus:
    # onShoot: rolls for every cast that goes off, including each burst of a held, channelled staff.
    - trigger: onShoot
      chance: 20
      effects:
        - { type: refundCost, resource: eitr }

  Mistcloak:
    - trigger: whenHit
      conditions: { selfBelowHealth: 30 }
      cooldown: 90
      effects:
        - { type: vanish, duration: 4, radius: 30, fx: vfx_blackice_destroyed, sound: mistcloaksound.ogg }

  RavenMantle:
    - trigger: passive
      effects:
        - { type: feathers, charges: 3, regrow: 10, fx: vfx_seagull_death, sound: sfx_archery_target_hit }

  KineticQuake:
    - trigger: onBlock
      conditions: { everyN: 10 }
      effects:
        - { type: nova, at: ahead, radius: 5, percentOfBlockPower: 30, damageType: blunt, stagger: 1, fx: vfx_RockDestroyed_large, sound: sfx_rock_wall_crumble }

  PathoftheRighteous:
    - trigger: onHit
      chance: 20
      cooldown: 15
      effects:
        - { type: shield, percentMaxHealth: 10, duration: 15 }

  RootedRevenge:
    - trigger: every
      every: 60-120
      conditions: { inCombat: 15 }
      effects:
        - { type: root, radius: 10, duration: 10, fx: vfx_beechlog_half_destroyed, sound: sfx_staff_elder_root_swing }
    - trigger: onHit
      conditions: { targetRooted: true }
      effects:
        - { type: addDamage, percent: 20 }

  BogWalkers:
    - trigger: passive
      effects:
        - { type: immunity, to: Wet }
        - { type: stat, stat: TarSlowReduction, value: 50 }
        - { type: stat, stat: SwimSpeed, value: 15 }
        - { type: stat, stat: AddPoisonResistancePercentage, value: 20 }

  GreedsCreed:
    - trigger: onHit
      effects:
        - { type: coinDamage, max: 25, scale: 1000 }

  HelsHarvest:
    # Like Keen Combat's Primal Rally, but raised by your kills: a thrall rises where the enemy fell.
    # Two can be raised, then a 3-minute wait.
    - trigger: onKill
      charges: 2
      cooldown: 180
      effects:
        - { type: summon, creature: "Charred_Twitcher|Skeleton", at: kill, duration: 30, max: 2, group: helsharvest }
