# Legendary Loot and ARPG - enemy scaling (CreatureLevelAndLootControl-style stars, with our enemy affixes).
# Every creature that spawns rolls its stars (replacing vanilla's 0-2): roll for +1 star, then again for the next,
# up to the biome's cap. Health and damage per star follow vanilla (+100% health, +50% damage per star).
# Bosses, tamed creatures, summons and bounty creatures keep their own levels.

enabled: true
starChance: 20            # percent chance for each extra star (Easy 10, Normal 20, Hard 30)
starChancePerBoss: 2      # +2 percent for every boss defeated in the world
maxStars: 5
# Highest stars for regular creatures in each biome. Set useBiomeCaps: false to allow maxStars everywhere.
useBiomeCaps: true
biomeCaps:
  Meadows: 2
  BlackForest: 3
  Swamp: 4
  Mountain: 5
  Plains: 5
  Mistlands: 5
  AshLands: 5
  DeepNorth: 5
sizePerStar: 0.1          # +10% size per star...
sizeFromStars: 3          # ...from 3 stars: 3 stars 30% bigger, 4 stars 40%, 5 stars 50%
# Creatures with 1+ stars get one effect; from infusionMinStars they may also get one infusion.
effectChance: 100         # percent
infusionMinStars: 3
infusionChance: 50        # percent
# Prefab names that never level up.
excluded: [Chicken, Hen]

# Effects (the name prefix, e.g. "Quick Greydwarf"). minStars: lowest star level that can roll it. weight: how often.
# minBiome (optional): only on creatures in that biome or later, by position on the biome ladder (Meadows 0 ...
# Mistlands 5, Ashlands 6, Deep North 7).
effects:
  Quick:      { minStars: 1, weight: 1, speed: 40 }                       # moves 40% faster
  Aggressive: { minStars: 2, weight: 1, attackSpeed: 25, interval: 50 }  # attacks 25% faster, 50% shorter pauses between attacks
  Curious:    { minStars: 1, weight: 1, senses: 100 }                     # sight and hearing +100%
  Splitting:  { minStars: 3, weight: 1, starsLost: 2 }                    # on death splits into two copies with 2 fewer stars (they drop no gear)
  Armored:    { minStars: 2, weight: 1, damageTaken: -25, speed: -50 }    # takes 25% less damage, moves 50% slower
  Rending:    { minStars: 2, weight: 1, chance: 25, percent: 10, duration: 5, cooldown: 30 }  # its hits: 25% chance to bleed you 10% of max health over 5 s (ignores armor and shields, can kill)
  Deadly:     { minStars: 3, weight: 1, chance: 20, damage: 150 }         # its hits: 20% chance to deal 150% damage
  Leeching:   { minStars: 1, weight: 1, percent: 20 }                     # heals itself for 20% of the damage it deals you
  Exhausting: { minStars: 1, weight: 1, percent: 15 }                     # its hits drain 15% of your max stamina
  Sapping:    { minStars: 1, weight: 1, percent: 30, minBiome: 5 }        # its hits drain 30% of your max eitr (Mistlands and later)

# Infusions: resist their element, weak to the opposite, and add that element to their hits (extra = % of the hit).
infusions:
  Fire-infused:      { minStars: 1, weight: 1, extra: 25 }              # sets you on fire
  Frost-infused:     { minStars: 1, weight: 1, extra: 25, frostSeconds: 3 }  # freezes you for 3 seconds
  Lightning-infused: { minStars: 1, weight: 1, extra: 25 }
  Spirit-infused:    { minStars: 1, weight: 1, extra: 25 }
  Poison-infused:    { minStars: 1, weight: 1, chance: 10, extra: 50, radius: 3 }  # immune to poison; 10% chance on hit for a poison burst within radius
  Chaos-infused:     { minStars: 4, weight: 1, extra: 25 }              # a random element each hit

# Auras: an effect repeated at the enemy's feet while you're nearby, so infusions show at a glance (plus a soft
# glow in the element's color). prefab: any vanilla effect (vfx_/fx_ names), or "random" for one of the other auras
# each time; interval: seconds between repeats;
# scale: size (it also grows with the enemy). Affixes without an aura just glow.
auras:
  Fire-infused: { prefab: fx_fireskeleton_nova, interval: 0.5, scale: 0.5 }
  Frost-infused: { prefab: vfx_dragon_ice_hit, interval: 5, scale: 0.5 }
  Poison-infused: { prefab: vfx_blob_attack, interval: 5, scale: 0.5 }
  Lightning-infused: { prefab: fx_lightningweapon_hit, interval: 3, scale: 1 }
  Spirit-infused: { prefab: vfx_Potion_stamina_medium, interval: 4, scale: 1 }
  Chaos-infused: { prefab: random, interval: 2, scale: 1 }   # random: another infusion's aura each time (at its size), replacing the last

# Loot: an enemy with an effect or infusion counts as +1 star for its loot roll.
affixLootStars: 1

# Unique enemies: rare elite versions of normal creatures, with a gold name and a gold glow. Each gets one affix from
# bossAffixes below plus one normal effect or infusion ("Enraged Quick Draugr"), and drops better loot.
uniques:
  enabled: true
  minMinutes: 20            # overworld: one every 20-40 minutes you spend outside bases and dungeons (per player)...
  maxMinutes: 40
  range: 80                 # ...the next creature that spawns naturally within this distance becomes the unique
  dungeonMin: 1             # unique enemies in each cave or dungeon
  dungeonMax: 3
  minStars: 2               # at least this many stars, still capped by biome (so Meadows uniques are always 2 stars)
  drops: 2                  # guaranteed gear drops
  uniqueChanceMultiplier: 2 # 2x the chance of a Unique item
  lootStars: 1              # +1 star on the loot roll
  aura:                     # an effect repeated on unique enemies (silent: its sounds are removed). prefab: none = off
    prefab: fx_Potion_fireresist
    interval: 2             # seconds between repeats
    scale: 1
    follow: true            # moves with the enemy
  look:                     # a liquid-gold coat over the creature (and the gear it wears)
    enabled: true
    style: metal            # metal: polished gold metal; tint: gold tint over its own look
    keepTexture: false      # metal: keep the creature's painted texture under the gold
    keepDetail: false       # metal: keep its bumpy surface detail (makes the reflections blocky)
    color: "#FFD15A"
    tint: 0.65              # tint style only: 0 = its own colors, 1 = solid gold
    metallic: 0.6           # 0-1: higher shows more of the surroundings, lower more of the gold
    smoothness: 0.6         # 0-1, how mirror-like
    emission: 0.15          # faint gold self-glow, so it shows in dark caves
    shimmer: 0.9            # metal: brightness of the bright gold bands sliding over it (0 = off)
    shimmerSpeed: 0.2
    shimmerBands: 3
    # Your own surface: a seamless tile (e.g. 256x256 or 512x512 PNG) in the mod's textures folder, scrolled over the
    # creature on a loop. If the file isn't there, the shimmer bands above are used instead.
    texture: uniquecoat.png
    textureGold: true       # tint the tile gold (best for grey images); false = use the tile's own colors
    textureTiling: 2        # how many times it repeats across the creature
    textureGlow: 0.6        # how much the tile's bright parts glow (0 = none)
    scrollX: 0.03           # tiles per second
    scrollY: 0.08
    overlay: true           # draw the tile as a glowing layer over the body, so it shows in any light
    overlayStrength: 1      # brightness of that layer
    overlayCutoff: 0.35     # parts of the tile darker than this are see-through, so only the bright lines glow
# Bosses: every boss gets one affix from bossAffixes, plus one normal effect or infusion per star (0 stars: none).
# Boss stars also raise the boss's Unique chance, and add a little health and damage (much less than normal stars).
bosses:
  enabled: true
  maxStars: 2               # up to 5
  starChance: 25            # percent chance for each extra star
  healthPerStar: 10         # percent more health per star (normal creatures get 100)
  damagePerStar: 5          # percent more damage per star (normal creatures get 50)
  twinHealth: 50            # Twin bosses: both have 50% of the (starred) boss's max health...
  twinDamage: 55            # ...and each deals 55% of its damage
  bossAffixes: 1
  excludedEffects: [Splitting]          # normal affixes bosses never get
  excludedAffixes:                      # boss affixes a boss never gets
    Dragon: [Black Hole]                # Moder
  adds:                                 # what Summoner calls for each boss (two of these each time)
    Eikthyr: [Boar, Neck]
    gd_king: [Greydwarf_Elite, Greydwarf_Shaman]
    Bonemass: [Blob, Draugr]
    Dragon: [Hatchling]
    GoblinKing: [GoblinBrute, Goblin]
    SeekerQueen: [SeekerBrute, Seeker]
    Fader: [Charred_Melee, Charred_Archer]

# Boss and unique-enemy affixes. weight: how often it rolls.
bossAffixes:
  Reflective:   { weight: 1, chance: 20, percent: 30 }                     # 20% of your hits on it reflect 30% of the damage back at you
  Mending:      { weight: 1, chance: 10, percent: 10, duration: 10, cooldown: 60 } # when hit: 10% chance to heal 10% of max health over 10 s; once a minute
  Summoner:     { weight: 1, count: 2, addStars: 1, step: 33 }             # each time it loses 33% of its health it calls 2 one-star copies of its kind (no gear)
  Elementalist: { weight: 1, damage: 20 }                                  # +20% elemental damage
  Enraged:      { weight: 1, damage: 20 }                                  # +20% physical damage
  Twin:         { weight: 1, health: -25, damage: -25 }                    # unique enemies: comes with a copy, both 25% less health and damage (bosses: see bosses.twinHealth); gear drops once
  Black Hole:   { weight: 1, interval: 20, range: 20 }                     # every 20 s pulls a player within 20 m to it (clear path only, never over lava)
