# Legendary Loot and ARPG - drop tables and rules.
# Percent values are written as percents (15 = 15%). Chances written as 0.10 are fractions (0.10 = 10%).
# Biome names: Meadows, BlackForest, Swamp, Mountain, Plains, Mistlands, AshLands, DeepNorth

# The biome ladder, lowest to highest. A biome's position is its "biome step" (Meadows = 0).
biomeOrder: [Meadows, BlackForest, Swamp, Mountain, Plains, Mistlands, AshLands, DeepNorth]
# Biomes that aren't on the ladder use another biome's tables.
biomeAliases:
  Ocean: Plains

# 1. Drop chance = (base + perBiomeStep x biome step + perStar x stars) x the config slider, capped at 100%.
dropChanceBase: 0.10
dropChancePerBiomeStep: 0.03
dropChancePerStar: 0.03
# Swarm creatures drop at half the chance.
swarmDropMultiplier: 0.5
swarmCreatures: [Tick, Bat, Deathsquito]

# 2. Chance the item comes from the next biome up (it still uses the mob's tier odds). Only when the config setting
#    "Drops from the next biome" is on; off by default, so drops stay in their biome.
nextBiomeChance: 0.03

# 4. Unique chance in percent: biome base + per star + Unique Find, capped (bosses are uncapped).
uniqueBaseChance:
  Meadows: 1
  BlackForest: 1
  Swamp: 2
  Mountain: 2
  Plains: 3
  Mistlands: 4
  AshLands: 5
  DeepNorth: 5
uniqueChancePerStar: 1
uniqueChanceCap: 15
uniqueChanceScale: 0.5    # every Unique chance (base, stars, Unique Find, caps, bosses, events) is multiplied by this,
                          # then by the config's "Unique drop rate" slider (1-5x)

# 5. Tier odds in percent: [Uncommon, Magic, Rare, Epic, Legendary]
tierOdds:
  Meadows:     [97, 3, 0, 0, 0]
  BlackForest: [70, 27, 3, 0, 0]
  Swamp:       [23, 40, 33, 4, 0]
  Mountain:    [10, 30, 50, 10, 0]
  Plains:      [0, 20, 40, 40, 0]
  Mistlands:   [0, 0, 25, 65, 10]
  AshLands:    [0, 0, 0, 67, 33]
  DeepNorth:   [0, 0, 0, 50, 50]

# 6. Star bump: chance per star to move the item up one tier, capped.
starBumpPerStar: 0.10
starBumpMax: 0.50

# Bosses: drops per nearby player, Unique chance multiplier, and the chance to move up a tier.
bossDropsPerPlayer: 2
bossUniqueMultiplier: 3
bossTierBumpChance: 0.55

# Weapons whose skill is listed here count as staffs. Add modded magic schools here.
magicSkills: [ElementalMagic, BloodMagic]
# Items with these skills never drop or roll affixes (tools).
excludedSkills: [Pickaxes, Fishing]
# Item categories that never drop: OneHanded, TwoHanded, TwoHandedLeft, Bow, Crossbow, Staff, Torch,
# Shield, Helmet, Chest, Legs, Shoulder, Utility, Trinket
excludedCategories: [Torch]
# Item prefab names that never drop.
excludedItems:
  # Deep North throwables and tools that look like gear to the game
  - BombBlob_Morkhalla   # Blob Bomb: Pulp
  - BombDynamite         # Ember Charge
  - GrapplingHook
  - Snowball
  - Shovel               # Snow Shovel
  - Lantern_DN           # Salvaged Lantern

